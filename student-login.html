<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | A.S Matawalle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-3">
        <img src="images/logo.png" alt="A.S Matawalle Logo" height="60">
        <h5 class="mt-2 fw-bold" style="color:var(--primary);">Student Portal</h5>
        <p class="text-muted small">Login from any phone with your account</p>
      </div>
      <form id="stuLoginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="stuEmail">Email</label>
          <input type="email" class="form-control" name="email" id="stuEmail" required placeholder="Same email used on admission form" autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="stuPassword">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="password" id="stuPassword" required autocomplete="current-password">
            <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small" for="rememberMe">Keep me logged in on this device</label>
        </div>
        <div id="stuLoginError" class="alert alert-danger d-none py-2 small"></div>
        <button type="submit" class="btn btn-gold w-100 py-2" id="loginBtn">
          <span class="btn-text">Login</span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
      <hr class="my-4">
      <p class="text-center small text-muted mb-2">Don't have an account?</p>
      <a href="student-signup.html" class="btn btn-outline-gold w-100">Sign Up</a>
      <p class="text-center mt-3 mb-0"><a href="index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Back to Website</a></p>
      <p class="text-center mt-2 mb-0 small text-muted">
        <i class="bi bi-cloud-check"></i> Accounts are stored online — register on one phone, log in on another.
      </p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/portal-data.js"></script>
  <script>
    // If already logged in on this device, go straight to dashboard
    (function() {
      const session = ASM.getStudentSession();
      if (session && session.loggedIn) {
        window.location.href = 'student-dashboard.html';
      }
    })();

    document.getElementById('stuLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('stuEmail').value.trim().toLowerCase();
      const password = document.getElementById('stuPassword').value;
      const err = document.getElementById('stuLoginError');
      const btn = document.getElementById('loginBtn');

      err.classList.add('d-none');
      btn.disabled = true;
      btn.querySelector('.btn-text').textContent = 'Logging in…';
      btn.querySelector('.spinner-border').classList.remove('d-none');

      try {
        const result = await ASM.loginStudent(email, password);

        if (result.ok) {
          ASM.setStudentSession(result.account);
          window.location.href = 'student-dashboard.html';
        } else {
          err.textContent = result.message;
          err.classList.remove('d-none');
          btn.disabled = false;
          btn.querySelector('.btn-text').textContent = 'Login';
          btn.querySelector('.spinner-border').classList.add('d-none');
        }
      } catch (ex) {
        err.textContent = 'Network error. Please check your internet and try again.';
        err.classList.remove('d-none');
        btn.disabled = false;
        btn.querySelector('.btn-text').textContent = 'Login';
        btn.querySelector('.spinner-border').classList.add('d-none');
      }
    });
  </script>
</body>
</html>
