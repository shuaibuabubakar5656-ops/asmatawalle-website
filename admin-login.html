<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | A.S Matawalle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-3">
        <img src="images/logo.png" alt="Logo" height="50" class="mb-2" onerror="this.style.display='none'">
        <h5 class="fw-bold" style="color:var(--primary);">Admin Portal</h5>
        <p class="text-muted small mb-0">Primary Administrator — CEO Only</p>
        <p class="text-muted small">Shuaibu Abubakar</p>
      </div>
      <form id="adminLoginForm">
        <div class="mb-3">
          <label class="form-label" for="adminEmail">Admin Email</label>
          <input type="email" class="form-control" name="email" id="adminEmail" required
                 placeholder="shuaibuabubakar5656@gmail.com" autocomplete="username"
                 value="shuaibuabubakar5656@gmail.com">
        </div>
        <div class="mb-3">
          <label class="form-label" for="adminPassword">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="password" id="adminPassword" required
                   autocomplete="current-password" placeholder="Enter password">
            <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div id="loginError" class="alert alert-danger d-none py-2 small"></div>
        <button type="submit" class="btn btn-navy w-100 py-2" id="adminLoginBtn">
          <span class="btn-text">Admin Login</span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
      <p class="text-center mt-3 mb-0">
        <a href="index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Back to Website</a>
      </p>
      <p class="text-center mt-2 mb-0 small text-muted">
        Open the site via <strong>http://localhost:3000</strong> (run <code>node backend/server.js</code> first).
      </p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/portal-data.js"></script>
  <script>
    // If already logged in as admin, go to dashboard
    (function () {
      const s = ASM.getAdminSession();
      if (s && s.loggedIn) {
        window.location.href = 'admin-dashboard.html';
      }
    })();

    document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim().toLowerCase();
      const password = document.getElementById('adminPassword').value;
      const errorBox = document.getElementById('loginError');
      const btn = document.getElementById('adminLoginBtn');

      errorBox.classList.add('d-none');
      btn.disabled = true;
      btn.querySelector('.btn-text').textContent = 'Logging in…';
      btn.querySelector('.spinner-border').classList.remove('d-none');

      try {
        const result = await ASM.loginAdmin(email, password);
        if (result.ok) {
          window.location.href = 'admin-dashboard.html';
          return;
        }
        errorBox.textContent = result.message || 'Login failed';
        errorBox.classList.remove('d-none');
      } catch (err) {
        errorBox.textContent = err.message || 'Network error. Is the server running?';
        errorBox.classList.remove('d-none');
      }

      btn.disabled = false;
      btn.querySelector('.btn-text').textContent = 'Admin Login';
      btn.querySelector('.spinner-border').classList.add('d-none');
    });
  </script>
</body>
</html>
