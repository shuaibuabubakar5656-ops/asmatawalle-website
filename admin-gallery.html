<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Upload | A.S Matawalle Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/portal.css" rel="stylesheet">
</head>
<body class="portal-body">
  <div class="portal-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm text-white d-lg-none" id="sidebarToggleBtn"><i class="bi bi-list fs-5"></i></button>
      
      <div class="brand-text d-none d-sm-block">A.S MATAWALLE PORTAL<small>Gallery</small></div>
    </div>
    <div class="user-chip"><i class="bi bi-person-circle"></i><span>Shuaibu Abubakar (CEO)</span></div>
  </div>
  <div class="d-flex">
    <aside class="portal-sidebar-fixed" id="adminSidebar">
      <div class="nav-section">Main</div>
      <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <div class="nav-section">Content</div>
      <a class="nav-link active" href="admin-gallery.html"><i class="bi bi-images"></i> Gallery Upload</a>
      <a class="nav-link" href="admin-news.html"><i class="bi bi-newspaper"></i> News</a>
      <a class="nav-link" href="admin-students.html"><i class="bi bi-people"></i> Students</a>
      <a class="nav-link" href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </aside>
    <main class="portal-main">
      <div class="page-header-portal">
        <div>
          <h1>Gallery Management</h1>
          <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="admin-dashboard.html">Dashboard</a></li><li class="breadcrumb-item active">Gallery</li></ol></nav>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="portal-card">
            <div class="card-header-p">Upload Photo</div>
            <div class="card-body-p">
              <form id="galForm">
                <div class="mb-3">
                  <label class="form-label-p">Caption / Title</label>
                  <input type="text" class="form-control form-control-p" placeholder="e.g. Training Lab 2026">
                </div>
                <div class="mb-3">
                  <label class="form-label-p">Category</label>
                  <select class="form-select form-select-p">
                    <option>Training Lab</option>
                    <option>Students</option>
                    <option>Graduation</option>
                    <option>Business Centre</option>
                    <option>Events</option>
                  </select>
                </div>
                <div class="mb-3">
                  <div class="upload-zone" onclick="document.getElementById('galFile').click()">
                    <i class="bi bi-image"></i>
                    <p class="mb-0 small">Click to select image</p>
                    <input type="file" id="galFile" class="d-none" accept="image/*" required>
                  </div>
                  <img id="galPreview" class="mt-2 rounded d-none" style="max-height:120px;" alt="Preview">
                </div>
                <button type="submit" class="btn btn-portal-primary w-100"><i class="bi bi-cloud-upload me-1"></i> Upload to Gallery</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="portal-card">
            <div class="card-header-p">Gallery Photos</div>
            <div class="card-body-p">
              <div class="row g-3" id="galGrid">
                <div class="col-6 col-md-4">
                  <div class="border rounded p-2 text-center bg-light">
                    <i class="bi bi-pc-display fs-2 text-secondary"></i>
                    <p class="small mb-1 mt-1">Training Lab</p>
                    <button class="btn btn-portal-danger btn-sm" onclick="this.closest('.col-6').remove()">Delete</button>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="border rounded p-2 text-center bg-light">
                    <i class="bi bi-people fs-2 text-secondary"></i>
                    <p class="small mb-1 mt-1">Students</p>
                    <button class="btn btn-portal-danger btn-sm" onclick="this.closest('.col-6').remove()">Delete</button>
                  </div>
                </div>
                <div class="col-6 col-md-4">
                  <div class="border rounded p-2 text-center bg-light">
                    <i class="bi bi-award fs-2 text-secondary"></i>
                    <p class="small mb-1 mt-1">Graduation</p>
                    <button class="btn btn-portal-danger btn-sm" onclick="this.closest('.col-6').remove()">Delete</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('sidebarToggleBtn')?.addEventListener('click', () => document.getElementById('adminSidebar').classList.toggle('show'));
    document.getElementById('galFile').addEventListener('change', function() {
      if (this.files[0]) {
        const r = new FileReader();
        r.onload = e => {
          const img = document.getElementById('galPreview');
          img.src = e.target.result;
          img.classList.remove('d-none');
        };
        r.readAsDataURL(this.files[0]);
      }
    });
    document.getElementById('galForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const title = this.querySelector('input').value || 'New Photo';
      const preview = document.getElementById('galPreview');
      const col = document.createElement('div');
      col.className = 'col-6 col-md-4';
      col.innerHTML = '<div class="border rounded p-2 text-center bg-light">' +
        (preview.src && !preview.classList.contains('d-none') ? '<img src="' + preview.src + '" class="img-fluid rounded mb-1" style="max-height:80px;">' : '<i class="bi bi-image fs-2 text-secondary"></i>') +
        '<p class="small mb-1 mt-1">' + title + '</p>' +
        '<button class="btn btn-portal-danger btn-sm" onclick="this.closest(\'.col-6\').remove()">Delete</button></div>';
      document.getElementById('galGrid').prepend(col);
      showToast('Photo uploaded to gallery.');
      this.reset();
      preview.classList.add('d-none');
    });
    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'alert alert-success position-fixed top-0 end-0 m-3 shadow';
      t.style.zIndex = 9999;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
  </script>
</body>
</html>
